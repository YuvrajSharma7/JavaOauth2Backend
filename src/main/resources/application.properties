server.port=8080
spring.profiles.active=prod
spring.application.name=Spring-boot-angular-google-oauth2
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=jdbc:mysql://${MYSQL_URL_HOST}:3306/oauth?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.url=jdbc:mysql://${MYSQL_URL_HOST}:3306/oauth?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PSWD}
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.main.allow-bean-definition-overriding=true
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=50000000
#Google Oauth
google.oauth.base.url=https://accounts.google.com/o/oauth2/v2/auth
google.oauth.redirect.url=https://${GOOGLE_OAUTH_REDIRECT_HOST}/google-redirect
google.oauth.response.type=code
google.oauth.client.id=${GOOGLE_CLIENT_ID}
google.oauth.client.secret=${GOOGLE_CLIENT_SECRET}
google.oauth.scope=https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fuserinfo.email+https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fuserinfo.profile+openid
google.oauth.access.type=offline
google.oauth.token.endpoint.base.url=https://oauth2.googleapis.com/token
